<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <form class="login-form">
        <h2>Login</h2>
        <div class="form-group">
          <label for="username">Username :</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password :</label>

          <div class="form-group-password">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              aria-describedby="pwHelp"
            />

            <button
              type="button"
              class="toggle-password"
              aria-label="Show password"
              aria-controls="password"
              aria-pressed="false"
              onclick="togglePassword(this)"
            >
              <svg
                class="icon-eye"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M12 5c-5 0-9.27 3.11-10.8 7.5C2.73 16.89 7 20 12 20s9.27-3.11 10.8-7.5C21.27 8.11 17 5 12 5zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-2.5a2 2 0 1 0 0-4.001 2 2 0 0 0 0 4z"
                />
              </svg>
              <svg
                class="icon-eye-off"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M2 4.27 3.28 3 21 20.72 19.73 22l-3.16-3.16A11.6 11.6 0 0 1 12 20C7 20 2.73 16.89 1.2 12.5c.79-2.23 2.27-4.12 4.16-5.46L2 4.27zM12 7c5 0 9.27 3.11 10.8 7.5-.55 1.54-1.48 2.9-2.65 3.98L18.1 16.9c.57-.8.9-1.78.9-2.85A5 5 0 0 0 14 9c-1.07 0-2.05.33-2.85.9L8.52 7.27A11.7 11.7 0 0 1 12 7zm0 3a3 3 0 0 1 3 3c0 .33-.05.64-.14.94L11.06 10.2c.3-.09.61-.14.94-.14z"
                />
              </svg>
              <span class="toggle-text"></span>
            </button>
          </div>
        </div>

        <script>
          function togglePassword(btn) {
            const input = document.getElementById("password");
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            btn.setAttribute("aria-pressed", String(isHidden));
            btn.setAttribute(
              "aria-label",
              isHidden ? "Hide password" : "Show password"
            );
            btn.dataset.visible = isHidden ? "true" : "false";
            const t = btn.querySelector(".toggle-text");
          }
        </script>
        <div class="checkbox">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>
        <button class="login-button" type="submit">Login</button>
        <hr />
        <p class="forgot-password"><a href="#">Forgot your password?</a></p>
        <p class="signup"><a href="#">Sign up</a></p>
      </form>
    </div>
  </body>
</html>
