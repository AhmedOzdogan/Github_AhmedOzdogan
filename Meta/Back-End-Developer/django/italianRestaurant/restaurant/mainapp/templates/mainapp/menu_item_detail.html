{% extends 'mainapp/base.html' %}
{% load static %}

{% block title %}{{ item.name }} - Details{% endblock %}

{% block extra_style %}
<style>
  .add-btn:hover {
    color: #fff;
    background-color: #28a745; /* Change color on hover */
  }
  .add-btn {
    background-color: #000000ff; /* Black background */
    color: #fff; /* White text */
    border: none; /* No border */
    padding: 10px 20px; /* Padding for button */
    font-size: 12px; /* Font size */
    cursor: pointer; /* Pointer cursor on hover */
    transition: background-color 0.3s ease; /* Smooth transition */
  }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
  <div class="row">
    <!-- Left column: Image -->
    <div class="col-12 col-lg-6 mb-4">
      <div class="card shadow h-100">
        <img src="{{ item.image.url }}" class="card-img-top img-fluid" alt="{{ item.name }}">
      </div>
    </div>

    <!-- Right column: Details and form -->
    <div class="col-12 col-lg-6 d-flex flex-column justify-content-center">
      <h2 class="mb-3">{{ item.name }}</h2>
      <p class="lead">{{ item.description }}</p>
      <p class="text-muted"><strong>Price: ${{ item.price }}</strong></p>

      <form method="POST" action="#">
        {% csrf_token %}
        <div class="form-group d-flex align-items-center">
          <label for="quantity" class="mr-2 mb-0">Quantity:</label>
          <input type="number" id="quantity" name="quantity" class="form-control w-25 mr-3" min="1" value="1">
          <button type="submit" class="btn btn-primary add-btn">Add to Order</button>
        </div>
      </form>

      <a href="{% url 'mainapp:menu' %}" class="btn btn-link mt-3">← Back to Menu</a>
    </div>
  </div>
</div>



{% endblock %}
