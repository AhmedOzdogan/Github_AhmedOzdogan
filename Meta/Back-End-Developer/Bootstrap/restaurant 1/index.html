<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Turkish Restaurant</title>
    <style>
        body {
            background-color: #e2e2e2;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h1{
            color:brown;
            font-weight: bold;
        }
        h2{
            color : blue
        }
        img{
            width: 200px;
            height: 100px;
            border-radius: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        #span1 {
            color: red;
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: dashed underline;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "row">
            <div class="col-12">
                <div class = "text-center">
                <h1>Turkish Restraunt</h1>
                </div>
            </div>
            <div class = "alert alert-dark text-center">
                Dont forget to make a reservation!
            </div>
        </div>
        <div class = "row">
            <div class = "col-12 col-lg-6 text-center">
                <h2>Menu</h2>
                <p>Turkish Kebap</p>
                <img src="turkish.jpg" alt="">
                <p>Pide</p>
                <img src="pide.jpg" alt="">
                <p>Doner Kebap</p>
                <img src="donerkebap.jpg" alt="">
            </div>
            <div class = "col-12 col-lg-6 text-center">
                <h2>Drinks</h2>
                <p>Turkish Tea</p>
                <img src="turkish-tea.jpg" alt="">
                <p>Ayran</p>
                <img src="ayran.img" alt="">
                <p>Orange Juice <span id="span1">Fresh</span></p>
                <img src="orange-juice.jpg" alt="">
            </div>

        </div>
        <div class="row">
            <button class="btn text-center">
                <a href="https://www.example.com" class="btn btn-success">Make a Reservation</a>
            </button>
            <button class="btn text-center">
                <a href="https://www.example.com" class="btn btn-primary">Find Us on Google Maps</a>
            </button>
        </div>
        <div class = "row">
            <h2 class = "text-center">Contact Us</h2>
            <p class = "text-center">For reservations, please call us at: <strong>+90 123 456 7890</strong></p>
            <p class = "text-center">Or email us at: <strong>info@turkishrestaurant.com</strong></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
